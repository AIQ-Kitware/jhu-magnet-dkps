title: "DKPS run-level prediction: 2x query efficiency (MAE in expectation)"

description: |
  CLAIM
    Informally: On most datasets, DKPS predicts a model's benchmark score at
    least as accurately from 4 queries as the naive sample mean does from 8.

    Formally: Let D be the set of evaluation datasets. For each dataset d, run
    N = 32 Monte-Carlo replicates. Replicate r draws a random target model
    (model_r) and random query samples, then records the absolute prediction
    error of each estimator:

        err_dkps[d][r]   = abs( DKPS_predict(model_r, queries=4) - true_score(model_r) )
        err_sample[d][r] = abs( sample_mean(model_r,  queries=8) - true_score(model_r) )

    The per-dataset MAE is the average of those N per-replicate errors:

        MAE_dkps(d)   = (1/N) * sum over r of  err_dkps[d][r]
        MAE_sample(d) = (1/N) * sum over r of  err_sample[d][r]

    The claim is:
        For at least 80% of d in D : MAE_dkps(d) <= MAE_sample(d)


claim_aggregation_strategy:
  type: fraction
  parameters:
    threshold: 0.80

claim:
  python: |
    assert _results['avg_dkps_mae'] <= _results['avg_sample_mae'], (
      f"[{dataset_cfg['dataset']}] "
      f"DKPS@{n_eval_small}={_results['avg_dkps_mae']:.4f} > "
      f"Sample@{n_eval_large}={_results['avg_sample_mae']:.4f} "
      f"(n_replicates={_results['num_replicates']})"
    )

symbols:
  helm_suite_path:
    type: str
    value: '/Users/bjohnson/data/crfm-helm-public/lite/benchmark_output/runs/_all'

  n_eval_small:
    type: int
    value: 4

  n_eval_large:
    type: int
    value: 8

  num_replicates:
    type: int
    value: 32

  num_example_runs:
    type: int
    value: 64

  n_components_cmds:
    type: int
    value: 8

  base_seed:
    type: int
    value: 1

  # Embedding for text-embedding datasets (math). Ignored for onehot datasets
  # (med_qa, legalbench), which the predictor embeds via one-hot instead.
  embed_provider:
    type: str
    value: "sentence-transformers"

  embed_model:
    type: str
    value: "nomic-ai/nomic-embed-text-v2-moe"

  # Split is not specified -- the predictor pools across all HELM splits.
  dataset_cfg:
    type: Any
    sweep:
      - {dataset: "med_qa",                                               metric: "quasi_exact_match"}
      - {dataset: "legalbench:subset=abercrombie",                         metric: "quasi_exact_match"}
      - {dataset: "legalbench:subset=corporate_lobbying",                  metric: "quasi_exact_match"}
      - {dataset: "legalbench:subset=function_of_decision_section",        metric: "quasi_exact_match"}
      - {dataset: "legalbench:subset=international_citizenship_questions",  metric: "quasi_exact_match"}
      - {dataset: "legalbench:subset=proa",                                metric: "quasi_exact_match"}
      - {dataset: "wmt_14:language_pair=cs-en", metric: "bleu_4"}
      - {dataset: "wmt_14:language_pair=de-en", metric: "bleu_4"}
      - {dataset: "wmt_14:language_pair=fr-en", metric: "bleu_4"}
      - {dataset: "wmt_14:language_pair=hi-en", metric: "bleu_4"}
      - {dataset: "wmt_14:language_pair=ru-en", metric: "bleu_4"}

  # Monte-Carlo over num_replicates seeds. Per seed: two predictor calls
  # (one at each query budget) so we can compare DKPS@n_eval_small vs
  # sample-mean@n_eval_large on the same randomly-chosen target model.
  _results:
    type: Any
    depends_on:
      - helm_suite_path
      - dataset_cfg
      - n_eval_small
      - n_eval_large
      - num_replicates
      - base_seed
      - num_example_runs
      - n_components_cmds
      - embed_provider
      - embed_model
    python: |
      from contextlib import redirect_stdout
      from io import StringIO
      from magnet.backends.helm.helm_outputs import HelmSuite
      from jhu_ta1.algorithms.dkps_run_predictor import DKPSRunPredictor

      suite   = HelmSuite(helm_suite_path)
      dataset = dataset_cfg['dataset']
      metric  = dataset_cfg['metric']

      def pull_actual(test_split):
          # Full-benchmark score: pool across all HELM splits (mean of the
          # per-split means), matching the predictor's split=None behavior.
          row = test_split.stats
          row = row[
              (row['stats.name.name'] == metric)
              & (row['stats.name.perturbation.name'].isna())
          ]
          return float(row['stats.mean'].mean())

      def pull_sample_mean(test_split):
          rows = test_split.per_instance_stats
          rows = rows[rows['per_instance_stats.stats.name.name'] == metric]
          return float(rows['per_instance_stats.stats.mean'].mean())

      errors_dkps_small   = []
      errors_sample_large = []
      for i in range(num_replicates):
          print(f"[{dataset}] Running replicate {i} of {num_replicates}...")
          seed = base_seed + i
          buf = StringIO()
          with redirect_stdout(buf):
              dkps_predictor = DKPSRunPredictor(
                  num_example_runs  = num_example_runs,
                  num_eval_samples  = n_eval_small,
                  random_seed       = seed,
                  n_components_cmds = n_components_cmds,
                  dataset           = dataset,
                  metric            = metric,
                  embed_provider    = embed_provider,
                  embed_model       = embed_model,
              )
              train_split_dkps, test_split_dkps = dkps_predictor.prepare_all_dataframes(suite)
              p_dkps       = float(dkps_predictor.predict(train_split_dkps, test_split_dkps.sequester())[0].mean)
              actual_dkps  = pull_actual(test_split_dkps)

              # Same seed -> same target model, but harness subsamples n_eval_large instances
              # (vs. n_eval_small in the dkps call) so the sample-mean is over a larger query set.
              sample_predictor = DKPSRunPredictor(
                  num_example_runs  = num_example_runs,
                  num_eval_samples  = n_eval_large,
                  random_seed       = seed,
                  n_components_cmds = n_components_cmds,
                  dataset           = dataset,
                  metric            = metric,
                  embed_provider    = embed_provider,
                  embed_model       = embed_model,
              )
              _, test_split_sample = sample_predictor.prepare_all_dataframes(suite)
              actual_sample = pull_actual(test_split_sample)
              p_sample      = pull_sample_mean(test_split_sample)

          errors_dkps_small.append(abs(p_dkps - actual_dkps))
          errors_sample_large.append(abs(p_sample - actual_sample))

      _results = {
          'avg_dkps_mae':   float(sum(errors_dkps_small)   / len(errors_dkps_small)),
          'avg_sample_mae': float(sum(errors_sample_large) / len(errors_sample_large)),
          'num_replicates': num_replicates,
      }
      print(f"[{dataset}] MAE(dkps @ n={n_eval_small})  = {_results['avg_dkps_mae']:.4f}")
      print(f"[{dataset}] MAE(sample @ n={n_eval_large}) = {_results['avg_sample_mae']:.4f}")
